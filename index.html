<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>دفتر مدرّس العربية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Readex+Pro:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: right-hand rail (RTL) with a working column; bottom tab bar on phones. Calm slate-blue ink on a soft mist ground, muted sand for marks and progress. */
:root{
  --bg:#e6e2dd; --surface:#f3f0ec; --surface2:#ebe7e2; --ink:#2b2427; --muted:#6f6467; --line:#d6cfc8;
  --brand:#7a3340; --brand-ink:#fbf4f2; --brand-soft:#ecdcdc; --gold:#a8834f; --gold-soft:#efe5d6;
  --ban1:#8c3a48; --ban2:#4e1b26; --ban-ink:#fbf1ef; --ban-sub:rgba(251,241,239,.78); --ban-glass:rgba(255,255,255,.12); --ban-edge:rgba(255,255,255,.22); --ban-drop:rgba(78,27,38,.38);
  --good:#3f7d5c; --good-soft:#e5f2ea; --warn:#9a7433; --warn-soft:#f6efe0; --bad:#b25a52; --bad-soft:#f8e8e6;
  --t-read:#3f7d78; --t-gram:#4f63a8; --t-expr:#a87a3c; --t-lit:#8a5a86; --t-rhet:#5d6e7c;
  --f-display:'Alexandria','Readex Pro',Tahoma,sans-serif; --f-body:'Readex Pro','Segoe UI',Tahoma,sans-serif; --f-text:'Noto Naskh Arabic','Traditional Arabic',serif;
  --shadow:0 1px 2px rgba(60,30,35,.05),0 6px 18px rgba(60,30,35,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151213; --surface:#1e1a1b; --surface2:#262122; --ink:#ece4e2; --muted:#a69a9b; --line:#352d2f;
  --brand:#d6929d; --brand-ink:#2a1015; --brand-soft:#3b2228; --gold:#d3b386; --gold-soft:#332c22;
  --good:#7fc39d; --good-soft:#1d3428; --warn:#dcb878; --warn-soft:#352d1e; --bad:#e3918a; --bad-soft:#3d2422;
  --t-read:#7cc4bd; --t-gram:#a3b1ec; --t-expr:#ddb27a; --t-lit:#cf9fcb; --t-rhet:#a9b9c6; --shadow:none; color-scheme:dark;
  --ban1:#6a2a36; --ban2:#2f1117; --ban-ink:#f6e9e7; --ban-sub:rgba(246,233,231,.72); --ban-glass:rgba(255,255,255,.08); --ban-edge:rgba(255,255,255,.14); --ban-drop:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
  --bg:#151213; --surface:#1e1a1b; --surface2:#262122; --ink:#ece4e2; --muted:#a69a9b; --line:#352d2f;
  --brand:#d6929d; --brand-ink:#2a1015; --brand-soft:#3b2228; --gold:#d3b386; --gold-soft:#332c22;
  --good:#7fc39d; --good-soft:#1d3428; --warn:#dcb878; --warn-soft:#352d1e; --bad:#e3918a; --bad-soft:#3d2422;
  --t-read:#7cc4bd; --t-gram:#a3b1ec; --t-expr:#ddb27a; --t-lit:#cf9fcb; --t-rhet:#a9b9c6; --shadow:none; color-scheme:dark;
  --ban1:#6a2a36; --ban2:#2f1117; --ban-ink:#f6e9e7; --ban-sub:rgba(246,233,231,.72); --ban-glass:rgba(255,255,255,.08); --ban-edge:rgba(255,255,255,.14); --ban-drop:rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;margin:0;font-weight:400;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:0;margin:0;text-wrap:balance;line-height:1.4}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.55rem;font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.2rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:start}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.82rem;color:var(--muted)}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)} .dot.local{background:var(--gold)}
.main{padding-block:28px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.flat{box-shadow:none} .card.raise{box-shadow:var(--shadow)}
.card h2,.card h3{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)} .btn.ghost:hover{background:var(--surface2);color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.7}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:.95rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat span{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.3;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip[data-t]{color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip[data-t=read]{--c:var(--t-read)} .chip[data-t=gram]{--c:var(--t-gram)} .chip[data-t=expr]{--c:var(--t-expr)} .chip[data-t=lit]{--c:var(--t-lit)} .chip[data-t=rhet]{--c:var(--t-rhet)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.1rem;margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface2);font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td input.num{width:76px;text-align:center;padding:5px 6px}
.unit{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.unit>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;padding:13px 16px;cursor:pointer}
.unit>button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.unit .no{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.unit .ttl b{font-family:var(--f-display);font-size:1.08rem}
.lesson{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.lesson .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.status{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:2px 12px;font-size:.8rem;cursor:pointer;font-weight:600;color:var(--muted)}
.status[data-s=doing]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.status[data-s=done]{background:var(--good-soft);color:var(--good);border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:.85rem;border-inline-start:1px solid var(--line);color:var(--muted)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"][data-c=p]{background:var(--good-soft);color:var(--good);font-weight:700}
.seg button[aria-pressed="true"][data-c=a]{background:var(--bad-soft);color:var(--bad);font-weight:700}
.seg button[aria-pressed="true"][data-c=l]{background:var(--warn-soft);color:var(--warn);font-weight:700}
.seg button[aria-pressed="true"][data-c=e]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.notice{background:var(--gold-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:.9rem}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)} .li:last-child{border-bottom:0}
.li>div{min-width:0}
.q{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.q.on{border-color:var(--brand);background:var(--brand-soft)}
.q p{margin:6px 0 0;font-family:var(--f-text);font-size:1.12rem;line-height:2}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:22px 26px;font-family:var(--f-text);font-size:1.1rem;line-height:2}
.paper h3{text-align:center;color:#111;font-size:1.25rem}
.paper table{margin:10px 0} .paper td,.paper th{border:1px solid #999;color:#111;background:#fff;font-size:.95rem;padding:4px 8px}
.refcard{border-inline-start:4px solid var(--gold)}
.refcard p{font-family:var(--f-text);font-size:1.1rem;line-height:2;margin:4px 0 8px;white-space:pre-wrap}
.cols{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:grid;grid-template-columns:78px 1fr 28px;gap:8px;align-items:center;font-size:.85rem}
.ovl{position:fixed;inset:0;background:rgba(8,20,24,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:4vh 12px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:780px;border:1px solid var(--line);display:flex;flex-direction:column}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.modal>.body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal>footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.steprow{display:grid;grid-template-columns:70px 1fr 2fr auto;gap:8px;align-items:start}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:.88rem}
.checks input{width:auto}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:.9rem;box-shadow:var(--shadow)}
.tt{display:grid;grid-template-columns:70px repeat(6,minmax(84px,1fr));gap:6px;align-items:center;min-width:640px}
.tt b{font-size:.8rem;color:var(--muted);text-align:center}
.timer{direction:ltr;font-family:var(--f-display);font-size:clamp(3.2rem,12vw,6rem);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 10px;color:var(--brand)}
.timer.low{color:var(--bad)}
.pick{min-height:120px;display:grid;place-items:center;text-align:center;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.4rem);padding:12px;margin-bottom:12px}
.pick.done{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.groups .g{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--surface2)}
.groups .g b{display:block;color:var(--brand);font-family:var(--f-display);margin-bottom:4px}
.groups .g ol{list-style:arabic-indic;margin:0;padding-inline-start:18px;font-size:.92rem}
.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pts>div{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.pts>div span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts .n{font-family:var(--f-display);font-weight:700;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.pts .n.pos{color:var(--good)} .pts .n.neg{color:var(--bad)}
.mgrid td,.mgrid th{padding:5px 6px;text-align:center;font-size:.8rem}
.mgrid td:nth-child(2),.mgrid th:nth-child(2){text-align:start;white-space:nowrap;position:sticky;inset-inline-start:0;background:var(--surface)}
.mk{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;font-weight:700;font-size:.72rem}
.mk.p{background:var(--good-soft);color:var(--good)} .mk.a{background:var(--bad-soft);color:var(--bad)} .mk.l{background:var(--warn-soft);color:var(--warn)} .mk.e{background:var(--brand-soft);color:var(--brand)}
.ans{margin-top:6px;font-size:.88rem;color:var(--good);background:var(--good-soft);border-radius:8px;padding:4px 10px}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface2);font-weight:700;font-size:.8rem}
.rank.top{background:var(--gold-soft);color:var(--gold)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.kpi span{display:block;font-size:.78rem;color:var(--muted)} .kpi b{font-family:var(--f-display);font-size:1.35rem}
.search{position:relative}
.sres{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}
.sres button{all:unset;cursor:pointer;display:block;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.sres button:hover,.sres button:focus-visible{border-color:var(--brand);background:var(--brand-soft)}
.kbd{font-family:ui-monospace,monospace;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.weekrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.weekrow:last-child{border-bottom:0}
.weekrow .wk b{display:block;font-family:var(--f-display)} .weekrow .wk span{font-size:.78rem;color:var(--muted)}
.weekrow .ls{display:flex;flex-wrap:wrap;gap:6px}
.tbar{display:flex;gap:6px}
/* maroon 3D banner */
.page-head{position:relative;overflow:hidden;isolation:isolate;align-items:center;padding:22px 26px;border-radius:18px;color:var(--ban-ink);
  background:linear-gradient(140deg,var(--ban1) 0%,var(--ban2) 100%);
  box-shadow:inset 0 1px 0 var(--ban-edge),inset 0 -4px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.08),0 14px 28px -12px var(--ban-drop),0 26px 40px -30px var(--ban-drop);
  transform:perspective(900px) rotateX(1.2deg);transform-origin:center top}
.page-head::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.18),transparent 55%),
  repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px),
  repeating-linear-gradient(-45deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px)}
.page-head::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%)}
.page-head h1{color:var(--ban-ink);text-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.18)}
.page-head p{color:var(--ban-sub)}
.page-head .btn,.page-head .ibtn{background:var(--ban-glass);color:var(--ban-ink);border-color:var(--ban-edge);box-shadow:inset 0 1px 0 var(--ban-edge),0 2px 4px rgba(0,0,0,.15)}
.page-head .btn:hover,.page-head .ibtn:hover{background:var(--ban-edge);color:var(--ban-ink);border-color:var(--ban-edge)}
.page-head .btn.primary{background:var(--ban-ink);color:var(--ban2);border-color:transparent}
.brand-mark{background:linear-gradient(140deg,var(--ban1),var(--ban2));color:var(--ban-ink);box-shadow:inset 0 1px 0 var(--ban-edge),0 4px 10px -3px var(--ban-drop)}
.btn.primary{background:linear-gradient(180deg,var(--ban1),var(--ban2));color:var(--ban-ink);border-color:var(--ban2);box-shadow:inset 0 1px 0 var(--ban-edge),0 2px 5px -1px var(--ban-drop)}
@media (prefers-reduced-motion:reduce){.page-head{transform:none}}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.ibtn:hover{color:var(--brand);border-color:var(--brand)}
.ibtn svg{width:19px;height:19px}
.rail .btn{width:100%}
.card{box-shadow:var(--shadow)}
.nav button[aria-current="page"]{font-weight:600}

/* ---------- lesson-plan templates (structure follows the book: ما قبل النص، النص، ما بعد النص، خلاصة القواعد، تقويم اللسان، أسئلة المناقشة) ---------- */

/* ---------- seed question bank (items taken from the textbooks' own content) ---------- */
const SEED_Q=[
 {id:'s1',kind:'gram',unit:'2.0',marks:3,src:'ج٢ ص٧',text:'للمفعول المطلق ثلاث حالات، اذكرها.',ans:'المؤكد لفعله، والمبيّن للنوع، والمبيّن للعدد.'},

 {id:'s14',kind:'rhet',unit:'1.7',marks:3,src:'ج١ ص١٣٧',text:'كوّن ثلاث جمل تشبيه مفيدة مضبوطة بالشكل.'},

const SEED_CARDS=[
 {id:'c1',title:'المفعول المطلق',src:'ج٢ ص٧-٨',body:'مصدر منصوب يأتي بعد الفعل والفاعل، من حروف الفعل نفسها.\nيقع في ثلاثة أحوال:\n١. مؤكّد لفعله: أحدقت بهم النارُ إحداقاً.\n٢. مبيّن للنوع: يذوب المعلّم ذوبانَ الشمعة.\n٣. مبيّن للعدد: ضرب المجاهد الأعداءَ ضربتين.\nينوب عنه: كلّ وبعض عند إضافتهما إلى المصدر، والمصدر المرادف، واسم الإشارة، والعدد، والآلة.'},

];

/* ---------- state ---------- */
function lcg(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function seedState(){
  const rnd=lcg(7),cid='c_'+uid();
  const names=['أحمد علي','حسين كاظم','مرتضى جاسم','محمد باقر','زينب حيدر','فاطمة هادي','علي صالح','يوسف عادل','سجاد رحيم','نور الهدى','عباس كريم','مريم سعد'];
  const students=names.map(n=>({id:'s_'+uid(),name:n}));
  const a1='a_'+uid(),a2='a_'+uid();
  const att={},scores={[a1]:{},[a2]:{}};
  const d=new Date();let back=0,done=0;
  while(done<4&&back<14){const x=new Date(d);x.setDate(d.getDate()-back);back++;if(x.getDay()>4)continue;done++;
    const rec={};students.forEach(s=>{const r=rnd();rec[s.id]=r<.8?'p':r<.9?'a':r<.95?'l':'e'});att[cid+'|'+iso(x)]=rec}
  students.forEach(s=>{const base=.45+rnd()*.5;scores[a1][s.id]=Math.round(base*100-rnd()*10);scores[a2][s.id]=Math.round(Math.min(1,base+.05)*20)});
  return {v:1,sample:true,teacher:'',school:'',
    classes:[{id:cid,name:'الرابع الإعدادي - أ (مثال)',students,sample:true}],
    att,assess:[{id:a1,cls:cid,name:'اختبار الشهر الأول',max:100},{id:a2,cls:cid,name:'اختبار يومي',max:20}],scores,
    progress:{},plans:{},tt:{},qs:SEED_Q.slice(),cards:SEED_CARDS.slice(),
    exam:{title:'اختبار شهري',school:'',cls:'',date:TODAY,time:'ساعة واحدة',sel:[]}};
}
let S=null;
try{const raw=localStorage.getItem('dm-state');if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||!S.classes)S=seedState();
function migrate(){S.pts=S.pts||{};S.notes=S.notes||{};S.sched=S.sched||{start:TODAY,per:4,weeks:16};S.exam.key=S.exam.key!==false;}
migrate();
function themeNow(){const t=document.documentElement.dataset.theme;return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
try{const th=localStorage.getItem('dm-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}

/* ---------- persistence: private db doc when available, local copy always ---------- */
let docRef=null,saving=false,dirty=false,timer=null,syncMode='local';
function touch(){dirty=true;try{localStorage.setItem('dm-state',JSON.stringify(S))}catch(e){}clearTimeout(timer);timer=setTimeout(flush,900)}
async function flush(){
  if(!docRef||saving||!dirty)return;saving=true;dirty=false;
  try{await docRef.set({s:JSON.stringify(S),t:Date.now()})}catch(e){syncMode='local';paintSync()}
  saving=false;if(dirty)flush();
}
function paintSync(){const el=$('#sync');if(el)el.innerHTML='<i class="dot'+(syncMode==='cloud'?'':' local')+'"></i>'+(syncMode==='cloud'?'محفوظ في حسابك':'محفوظ على هذا الجهاز')}
async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db)return;
    const id=await user.id();if(!id)return;
    docRef=db.doc('data/users/'+id+'/teacher');
    const snap=await docRef.get();
    syncMode='cloud';
    if(snap.exists){
      const d=snap.data();let remote=null;try{remote=JSON.parse(d.s)}catch(e){}
      if(remote&&remote.classes){S=remote;migrate();try{localStorage.setItem('dm-state',JSON.stringify(S))}catch(e){}render()}
    }else{dirty=true;flush()}
    paintSync();
  }catch(e){syncMode='local';paintSync()}
}

/* ---------- derived data ---------- */
const cls=id=>S.classes.find(c=>c.id===id);
const gradeLabel=p=>p>=90?['امتياز','good']:p>=80?['جيد جداً','good']:p>=70?['جيد','']:p>=60?['متوسط','warn']:p>=50?['مقبول','warn']:['ضعيف','bad'];
function avgOf(c,sid){let s=0,m=0;S.assess.filter(a=>a.cls===c.id).forEach(a=>{const v=(S.scores[a.id]||{})[sid];if(typeof v==='number'){s+=v;m+=a.max}});return m?s/m*100:null}
function absOf(c,sid){let n=0;Object.keys(S.att).forEach(k=>{if(k.startsWith(c.id+'|')&&S.att[k][sid]==='a')n++});return n}
function attRate(c){let t=0,p=0;Object.keys(S.att).forEach(k=>{if(!k.startsWith(c.id+'|'))return;Object.values(S.att[k]).forEach(v=>{t++;if(v==='p'||v==='l')p++})});return t?p/t*100:null}
const prog=id=>S.progress[id]||'todo';

/* ---------- Today ---------- */
function vToday(){
  const now=new Date(),h=now.getHours(),dow=now.getDay();
  const hi=h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير';
  const students=S.classes.reduce((n,c)=>n+c.students.length,0);
  const rates=S.classes.map(attRate).filter(x=>x!=null),ar_=rates.length?rates.reduce((a,b)=>a+b)/rates.length:null;
  const avgs=[];S.classes.forEach(c=>c.students.forEach(s=>{const a=avgOf(c,s.id);if(a!=null)avgs.push(a)}));
  const avg=avgs.length?avgs.reduce((a,b)=>a+b)/avgs.length:null;
  const periods=[];for(let p=1;p<=6;p++){const cid=S.tt[dow+'-'+p];if(cid&&cls(cid))periods.push([p,cls(cid)])}
  const next=LESSONS.filter(l=>prog(l.id)!=='done').slice(0,4);
  const risk=[];S.classes.forEach(c=>c.students.forEach(s=>{const a=absOf(c,s.id),v=avgOf(c,s.id);if(a>=2)risk.push([s.name,c.name,'غياب '+ar(a)+' مرات','warn']);if(v!=null&&v<50)risk.push([s.name,c.name,'معدل '+ar(Math.round(v))+'٪','bad'])}));
  return head(hi+(S.teacher?'، '+esc(S.teacher):''),fmtDate(TODAY)+(hijri()?' · '+hijri():''),'<button class="btn" data-act="tt">الجدول الأسبوعي</button>')
  +'<div class="stats"><div class="stat"><span>الطلاب</span><b>'+ar(students)+'</b></div><div class="stat"><span>نسبة الحضور</span><b>'+(ar_==null?'—':ar(Math.round(ar_))+'٪')+'</b></div><div class="stat"><span>معدل الدرجات</span><b>'+(avg==null?'—':ar(Math.round(avg))+'٪')+'</b></div><div class="stat"><span>إنجاز المنهج</span><b>'+ar(Math.round(progressOf()))+'٪</b></div></div>'
  +'<div class="grid2"><section class="card"><h2>حصص اليوم</h2>'
  +(dow>4?empty('عطلة نهاية الأسبوع','لا توجد حصص مجدولة اليوم.'):periods.length?'<div class="list">'+periods.map(p=>'<div class="li"><div><b>الحصة '+ar(p[0])+'</b> <span class="muted">· '+esc(p[1].name)+'</span></div><button class="btn sm" data-act="takeatt" data-c="'+p[1].id+'">تسجيل الحضور</button></div>').join('')+'</div>':empty('الجدول فارغ','أدخل حصصك الأسبوعية لتظهر هنا كل يوم.','<button class="btn primary sm" data-act="tt">إعداد الجدول</button>'))+'</section>'
  +'<section class="card"><h2>الدروس القادمة</h2>'+(next.length?'<div class="list">'+next.map(l=>'<div class="li"><div><span class="chip" data-t="'+l.type+'">'+TYPES[l.type]+'</span> <b>'+esc(l.title)+'</b><div class="muted small">'+l.partName+' · '+esc(l.unit)+'</div></div><button class="btn sm" data-act="plan" data-l="'+l.id+'">'+(S.plans[l.id]?'فتح التحضير':'تحضير')+'</button></div>').join('')+'</div>':empty('أنجزت المنهج','كل الدروس مكتملة.'))+'</section></div>'
  +'<div class="grid2" style="margin-top:16px"><section class="card"><h2>تقدّم المنهج</h2>'+CUR.map(p=>{const v=progressOf(p.id);return '<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>'+p.name+'</b><span class="muted small">'+ar(Math.round(v))+'٪</span></div><div class="bar"><i style="width:'+v+'%"></i></div></div>'}).join('')+'</section>'
  +'<section class="card"><h2>طلاب يحتاجون متابعة</h2>'+(risk.length?'<div class="list">'+risk.slice(0,6).map(r=>'<div class="li"><div><b>'+esc(r[0])+'</b><div class="muted small">'+esc(r[1])+'</div></div><span class="chip '+r[3]+'">'+r[2]+'</span></div>').join('')+'</div>':empty('لا تنبيهات','لا غياب متكرر ولا معدلات منخفضة.'))+'</section></div>';
}

/* ---------- ranking ---------- */
function rankOf(c,sid){const v=avgOf(c,sid);if(v==null)return 0;let r=1;c.students.forEach(s=>{const x=avgOf(c,s.id);if(x!=null&&x>v)r++});return r}
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function classTabs(cur,act){return '<div class="tabs">'+S.classes.map(x=>'<button class="tab" data-act="'+act+'" data-c="'+x.id+'" aria-pressed="'+(x.id===cur)+'">'+esc(x.name)+'</button>').join('')+'</div>'}
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};

/* ---------- semester schedule ---------- */
function schedWeeks(){
  const sc=S.sched,per=Math.max(1,+sc.per||1),out=[];
  for(let i=0;i<LESSONS.length;i+=per)out.push(LESSONS.slice(i,i+per));
  return out.map((ls,i)=>({no:i+1,from:addDays(sc.start,i*7),to:addDays(sc.start,i*7+4),ls}));
}
function vSched(){
  const W=schedWeeks(),sc=S.sched,cur=W.findIndex(w=>TODAY>=w.from&&TODAY<=addDays(w.from,6));
  const behind=cur>=0?W.slice(0,cur).reduce((n,w)=>n+w.ls.filter(l=>prog(l.id)!=='done').length,0):0;
  return '<div class="card flat" style="margin-bottom:14px"><div class="fields"><label class="f">بداية الفصل<input type="date" id="sc-start" data-ch="sched" value="'+esc(sc.start)+'"></label><label class="f">دروس في الأسبوع<input type="number" min="1" max="10" id="sc-per" data-ch="sched" value="'+esc(sc.per)+'"></label></div>'
  +'<div class="row" style="margin-top:12px;justify-content:space-between"><span class="muted small">'+ar(LESSONS.length)+' درساً موزعة على '+ar(W.length)+' أسبوعاً'+(cur>=0?' · نحن في الأسبوع '+ar(cur+1):'')+'</span><button class="btn" data-act="dlsched">تنزيل الخطة Word</button></div>'
  +(behind?'<div class="notice" style="margin:12px 0 0"><span>متأخر عن الخطة بـ '+ar(behind)+' درساً من الأسابيع الماضية.</span></div>':'')+'</div>'
  +'<div class="card">'+W.map((w,i)=>'<div class="weekrow"'+(i===cur?' style="background:var(--brand-soft);border-radius:10px;padding-inline:10px"':'')+'><div class="wk"><b>الأسبوع '+ar(w.no)+'</b><span>'+fmtDate(w.from,{day:'numeric',month:'short'})+' - '+fmtDate(w.to,{day:'numeric',month:'short'})+'</span></div><div class="ls">'+w.ls.map(l=>'<span class="chip" data-t="'+l.type+'" title="'+esc(l.unit)+'">'+(prog(l.id)==='done'?'✓ ':'')+TYPES[l.type]+': '+esc(l.title)+'</span>').join('')+'</div></div>').join('')+'</div>';

function studentStats(c,s){
  let p=0,a=0,l=0,e=0;Object.keys(S.att).forEach(k=>{if(!k.startsWith(c.id+'|'))return;const v=S.att[k][s.id];if(v==='p')p++;else if(v==='a')a++;else if(v==='l')l++;else if(v==='e')e++});
  const v=avgOf(c,s.id),rows=S.assess.filter(x=>x.cls===c.id).map(x=>[x.name,(S.scores[x.id]||{})[s.id],x.max]);
  return {p,a,l,e,v,rk:rankOf(c,s.id),pts:(S.pts[c.id]||{})[s.id]||0,rows};
}

async function saveFile(name,html,ext){
  const doc='<html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;direction:rtl;line-height:1.9}table{border-collapse:collapse}td,th{border:1px solid #888;padding:6px}</style></head><body>'+html+'</body></html>';
  try{
    const d=await window.claude.use('downloads');if(!d)throw 0;
    try{await d.save({filename:name+'.'+(ext||'doc'),data:doc});toast('تم الحفظ');return}catch(e){await d.save({filename:name+'.html',data:doc});toast('تم الحفظ بصيغة HTML');return}
  }catch(e){
    if(!window.claude){try{const u=URL.createObjectURL(new Blob(['\ufeff'+doc],{type:'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download=name+'.'+(ext||'doc');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('تم التنزيل');return}catch(x){}}
    try{await navigator.clipboard.writeText(new DOMParser().parseFromString(html,'text/html').body.innerText);toast('تعذّر التنزيل هنا، نُسخ النص بدلاً منه')}catch(x){toast('تعذّر التنزيل في هذا العرض')}
  }
}

 settings(){modal('الإعدادات','<div class="fields"><label class="f">اسم المدرّس<input id="st" value="'+esc(S.teacher)+'"></label><label class="f">المدرسة<input id="ss" value="'+esc(S.school)+'"></label></div><p class="muted small" style="margin:0">تُحفظ بياناتك في حسابك بشكل خاص، ولا يراها غيرك. النسخة الاحتياطية ملف JSON يمكنك الاحتفاظ به.</p>','<button class="btn primary" data-act="savesettings">حفظ</button><button class="btn" data-act="backup">تنزيل نسخة احتياطية</button>')},

 async backup(){if(!window.claude){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='دفتر-المدرس-نسخة.json';document.body.appendChild(a);a.click();a.remove();return toast('تم التنزيل')}try{const d=await window.claude.use('downloads');await d.save({filename:'دفتر-المدرس-نسخة.json',data:JSON.stringify(S)});toast('تم الحفظ')}catch(e){toast('تعذّر التنزيل في هذا العرض')}},
 savett(){document.querySelectorAll('#layer select[data-tt]').forEach(s=>{if(s.value)S.tt[s.dataset.tt]=s.value;else delete S.tt[s.dataset.tt]});touch();close();paintMain()},
 theme(){const t=themeNow()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('dm-theme',t)}catch(e){}render();toast(t==='dark'?'الوضع الليلي':'الوضع النهاري')},
 search(){openSearch()},
 gq(b){close();UI.view='exams';UI.qf={kind:'',unit:'',q:S.qs.find(x=>x.id===b.dataset.q).text.slice(0,20)};render()},
 gref(b){close();UI.view='ref';UI.rq=b.dataset.l;render()},
 ctab(b){UI.ctab=b.dataset.t;paintMain()},
 dlsched(){saveFile('الخطة-الفصلية-عربي',schedDoc())},
 tcls(b){UI.tcls=b.dataset.c;paintMain()},
 rcls(b){UI.rcls=b.dataset.c;paintMain()},
 pick(){const c=cls(UI.tcls);if(!c.students.length)return toast('لا طلاب في الشعبة');const used=UI.usedPick[c.id]=UI.usedPick[c.id]||[];let pool=c.students.filter(s=>!UI.noRepeat||!used.includes(s.id));if(!pool.length){UI.usedPick[c.id]=[];pool=c.students;toast('أجاب الجميع، بدأت دورة جديدة')}
  const win=pool[Math.floor(Math.random()*pool.length)],el=$('#pick');let n=0;el.classList.remove('done');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fin=()=>{UI.picked={c:c.id,s:win.id,n:win.name};(UI.usedPick[c.id]=UI.usedPick[c.id]||[]).push(win.id);paintMain()};
  if(reduce)return fin();
  const h=setInterval(()=>{el.textContent=c.students[Math.floor(Math.random()*c.students.length)].name;if(++n>14){clearInterval(h);fin()}},70)},
 pickreset(){UI.usedPick[UI.tcls]=[];UI.picked=null;paintMain()},
 tmset(b){const m=+b.dataset.m;UI.tm={total:m*60,left:m*60,run:false,end:0};paintMain()},
 tmgo(){const t=UI.tm;if(t.run){t.run=false;t.left=Math.max(0,(t.end-Date.now())/1000)}else{if(t.left<=0)t.left=t.total;t.end=Date.now()+t.left*1000;t.run=true}paintMain()},
 tmreset(){UI.tm.run=false;UI.tm.left=UI.tm.total;paintMain()},
 groups(){const c=cls(UI.tcls),rec=S.att[c.id+'|'+TODAY]||{},st=shuffle(c.students.filter(s=>rec[s.id]!=='a')),n=Math.max(2,Math.min(12,+UI.gN||2)),g=Array.from({length:n},()=>[]);st.forEach((s,i)=>g[i%n].push(s.name));UI.groups={c:c.id,g:g.filter(x=>x.length)};paintMain()},
 copygroups(){copy(UI.groups.g.map((g,i)=>'المجموعة '+(i+1)+':\n'+g.map(n=>'- '+n).join('\n')).join('\n\n'))},
 ptq(b){const m=S.pts[UI.tcls]=S.pts[UI.tcls]||{};m[b.dataset.s]=(m[b.dataset.s]||0)+(+b.dataset.d);touch();paintMain()},
 ptsreset(){ask('تصفير نقاط المشاركة لهذه الشعبة؟',()=>{S.pts[UI.tcls]={};touch();close();paintMain()})},
 card(b){close();openCard(b.dataset.c,b.dataset.s)},
 savenote(b){const v=$('#snote').value.trim();if(v)S.notes[b.dataset.s]=v;else delete S.notes[b.dataset.s];touch();toast('حُفظت الملاحظة')},
 dlcard(b){const c=cls(b.dataset.c),s=c.students.find(x=>x.id===b.dataset.s);S.notes[s.id]=$('#snote').value.trim()||S.notes[s.id];saveFile('تقرير-'+s.name,cardDoc(c,s))},
 msgcard(b){const c=cls(b.dataset.c),s=c.students.find(x=>x.id===b.dataset.s);copy(cardMsg(c,s))},
 absmsg(){const c=cls(UI.cls),rec=S.att[c.id+'|'+UI.date]||{},ab=c.students.filter(s=>rec[s.id]==='a');if(!ab.length)return toast('لا غياب مسجّل في هذا اليوم');copy(ab.map(s=>'ولي أمر الطالب '+s.name+' المحترم، نعلمكم بغياب ابنكم عن درس اللغة العربية يوم '+fmtDate(UI.date)+'. مع التقدير.').join('\n\n'));},
 xlsgrades(b){const c=cls((b&&b.dataset.c)||UI.gcls||UI.rcls||S.classes[0].id),as=S.assess.filter(a=>a.cls===c.id);const rows=[['ت','الاسم',...as.map(a=>a.name+' ('+a.max+')'),'النسبة','التقدير','الترتيب']].concat(c.students.map((s,i)=>{const v=avgOf(c,s.id);return [i+1,s.name,...as.map(a=>{const x=(S.scores[a.id]||{})[s.id];return typeof x==='number'?x:''}),v==null?'':Math.round(v),v==null?'':gradeLabel(v)[0],rankOf(c,s.id)||'']}));saveFile('درجات-'+c.name,'<h3>'+esc(c.name)+' - درجات اللغة العربية</h3>'+xlsTable(rows),'xls')},
 xlsatt(){const c=cls(UI.rcls),days=monthDays(c,UI.month);const rows=[['ت','الاسم',...days,'غياب']].concat(c.students.map((s,i)=>{let a=0;return [i+1,s.name,...days.map(d=>{const v=(S.att[c.id+'|'+d]||{})[s.id];if(v==='a')a++;return v?({p:'ح',a:'غ',l:'ت',e:'م'})[v]:''}),a]}).map(r=>{r[r.length-1]=r.filter(x=>x==='غ').length;return r}));saveFile('حضور-'+c.name+'-'+UI.month,'<h3>'+esc(c.name)+' - حضور '+UI.month+'</h3>'+xlsTable(rows),'xls')},
 editq(b){const q=S.qs.find(x=>x.id===b.dataset.q);A.addq();$('#qk').value=q.kind;$('#qu').value=q.unit||'';$('#qm').value=q.marks;$('#qt').value=q.text;$('#qa').value=q.ans||'';const sb=$('#layer [data-act=saveq]');sb.dataset.q=q.id;sb.textContent='حفظ التعديل';$('#layer h2').textContent='تعديل السؤال'},
 dlexamB(){saveFile('اختبار-'+(S.exam.title||'عربي')+'-نموذج-ب',examDoc(shuffle(S.exam.sel),'نموذج ب'))},
 dlkey(){const sel=S.exam.sel.map(x=>({x,q:S.qs.find(q=>q.id===x.id)})).filter(o=>o.q);saveFile('نموذج-الإجابة-'+(S.exam.title||'عربي'),'<h3>نموذج الإجابة: '+esc(S.exam.title)+'</h3>'+sel.map((o,i)=>'<p><b>س'+ar(i+1)+': '+esc(o.q.text)+' ('+ar(o.x.marks)+' درجات)</b><br>ج: '+(o.q.ans?esc(o.q.ans):'........................................')+'</p>').join(''))},
 autoexam(){const f=UI.qf,pool=S.qs.filter(q=>(!f.kind||q.kind===f.kind)&&(!f.unit||q.unit===f.unit));if(!pool.length)return toast('لا أسئلة مطابقة للمرشحات');S.exam.sel=shuffle(pool).slice(0,5).map(q=>({id:q.id,marks:q.marks||2}));touch();paintMain();toast('اختيرت '+ar(S.exam.sel.length)+' أسئلة عشوائياً')},
 yes(){const f=ask.fn;ask.fn=null;if(f)f()},
 close(){close()},
 ovl(b,e){if(e.target===b)close()}
};
function names(t){return t.split('\n').map(x=>x.trim()).filter(Boolean).map(n=>({id:'s_'+uid(),name:n}))}
function cardForm(c){modal(c.id?'تعديل البطاقة':'بطاقة جديدة','<label class="f">العنوان<input id="ct" value="'+esc(c.title||'')+'"></label><label class="f">المرجع (اختياري)<input id="cs2" value="'+esc(c.src||'')+'" placeholder="مثال: ج٢ ص٧"></label><label class="f">النص<textarea id="cb" rows="8">'+esc(c.body||'')+'</textarea></label>','<button class="btn primary" data-act="savecard" data-c="'+(c.id||'')+'">حفظ</button>')}
function openTT(){
  if(!S.classes.length)return toast('أنشئ شعبة أولاً');
  const opts=v=>'<option value="">—</option>'+S.classes.map(c=>'<option value="'+c.id+'"'+(c.id===v?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  let g='<div style="overflow-x:auto"><div class="tt"><b></b>'+DAYS.map(d=>'<b>'+d+'</b>').join('')+'';
  for(let p=1;p<=6;p++){g+='<b>الحصة '+ar(p)+'</b>';for(let d=0;d<5;d++)g+='<select data-tt="'+d+'-'+p+'" aria-label="'+DAYS[d]+' الحصة '+p+'">'+opts(S.tt[d+'-'+p])+'</select>'}
  modal('الجدول الأسبوعي',g+'</div></div>','<button class="btn primary" data-act="savett">حفظ الجدول</button>');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){if(b.dataset.act!=='ovl'&&b.dataset.act!=='takeatt')e.stopPropagation();f(b,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)close();else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#layer').innerHTML){e.preventDefault();openSearch()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#p-steps'))totalSteps();
  if(t.id==='gs')searchFill(t.value);
  if(t.dataset&&t.dataset.ch==='marks'){const x=S.exam.sel.find(s=>s.id===t.dataset.q);if(x){x.marks=Number(t.value)||0;touch();$('#extotal').textContent=ar(S.exam.sel.reduce((a,s)=>a+(Number(s.marks)||0),0))}}
  if(t.dataset&&t.dataset.a&&t.dataset.s&&t.classList.contains('num')){
    const a=S.assess.find(x=>x.id===t.dataset.a);let v=t.value===''?null:Number(t.value);
    if(v!=null&&(v<0||v>a.max)){t.style.borderColor='var(--bad)';return}t.style.borderColor='';
    const m=S.scores[a.id]=S.scores[a.id]||{};if(v==null)delete m[t.dataset.s];else m[t.dataset.s]=v;touch();
    const c=cls(UI.gcls),r=t.closest('tr'),avg=avgOf(c,t.dataset.s);r.querySelector('.pc').innerHTML=pc(avg);r.querySelector('.gl').innerHTML=gl(avg);
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='attdate'){UI.date=t.value||TODAY;paintMain()}
  else if(t.dataset&&t.dataset.ch==='qf'){UI.qf={kind:$('#qf-kind').value,unit:$('#qf-unit').value,q:$('#qf-q').value.trim()};paintMain()}
  else if(t.dataset&&t.dataset.ch==='ex'){S.exam.title=$('#ex-title').value;S.exam.school=$('#ex-school').value;S.exam.cls=$('#ex-cls').value;S.exam.date=$('#ex-date').value;S.exam.time=$('#ex-time').value;touch()}
  else if(t.dataset&&t.dataset.ch==='sched'){S.sched={start:$('#sc-start').value||TODAY,per:Math.max(1,+$('#sc-per').value||1)};touch();paintMain()}
  else if(t.dataset&&t.dataset.ch==='norep'){UI.noRepeat=t.checked}
  else if(t.dataset&&t.dataset.ch==='gN'){UI.gN=+t.value||4}
  else if(t.dataset&&t.dataset.ch==='rmonth'){UI.month=t.value||TODAY.slice(0,7);paintMain()}
  else if(t.dataset&&t.dataset.ch==='rq'){UI.rq=t.value.trim();paintMain();const r=$('#rq');if(r){r.focus();r.setSelectionRange(r.value.length,r.value.length)}}
});

render();
connect();
})();
</script>
